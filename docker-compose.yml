version: '3.8'
services:
 web:
   image: nginx:latest
   ports:
     - "8080:80"
   volumes:
     - ./html:/usr/share/nginx/html
 app:
   build: ./app
   ports:
     - "5000:5000"
   environment:
     - FLASK_ENV=development
   depends_on:
     - db
 db:
   image: postgres:13
   environment:
     POSTGRES_USER: user
     POSTGRES_PASSWORD: password
     POSTGRES_DB: mydatabase
   volumes:
     - db_data:/var/lib/postgresql/data
volumes:
 db_data: