name: Solar System workflow

on:
  workflow_dispatch:
  push:
    branches:
        - main
        - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
    unit-testing:
        name: Unit Testing
        strategy:
            matrix:
                nodejs_version: [20]
                operating_system: [ubuntu-latest]
                #operating_system: [ubuntu-latest, macos-latest]

                exclude:
                    - nodejs_version: 18
                      operating_system: macos-latest 
        runs-on: ${{ matrix.operating_system }}
        steps:
            - name: checkout Repository
              uses: actions/checkout@v4
            
            - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
              uses: actions/setup-node@v6.2.0
              with:
                node-version: ${{ matrix.nodejs_version }}

            - name: Install Dependencies
              run: npm install

            - name: Unit Testing
              id: hamada
              run: npm test

            - name: Archive test result
              if: steps.hamada.outcome == 'failure' || steps.hamada.outcome == 'success' 
              uses: actions/upload-artifact@v6
              with:
                name: Mocha-Test-Result
                path: test-results.xml
    code-coverage:
        name: code coverage
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
              uses: actions/setup-node@v6.2.0
              with:
                node-version: 20

            - name: Install Dependencies
              run: npm install


            - name: check code coverage
              continue-on-error: true
              run: npm run coverage

            - name: Archive test result
              uses: actions/upload-artifact@v6
              with:
                name: code-coverage-Result
                path: coverage
                retention-days: 5 

    docker:
        name: continerization
        needs: [code-coverage,unit-testing]
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: docker login
              uses: docker/login-action@v3.7.0
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build
              uses: docker/build-push-action@v6.18.0
              with:
                context: .
                push: false
                tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-systemtest:${{ github.sha }}


            - name: Docker Image test
              run: |
               docker images
               docker run --name solar-system-app -d \
               -p 3000:3000 \
               -e MONGO_URI=$MONGO_USERNAME \
               -e MONGO_PASSWORD=$MONGO_PASSWORD \
               ${{ vars.DOCKERHUB_USERNAME }}/solar-systemtest:${{ github.sha }}
               export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
               echo $IP

               echo testing image url using wget
               wget -q -O -127.0.0.1:3000/live | grep live

              




            