name: test

on:
  workflow_dispatch:
  push: 
    branches:
        - main
jobs:
    
    docker:
        name: containerization
        permissions:
          packages: write
        runs-on: self-hosted
        steps:
          - name: checkout
            uses: actions/checkout@v4
            
          - name: docker login
            uses: docker/login-action@v2.2.0
            with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_PASSWORD }}
  